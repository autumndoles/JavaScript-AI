<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #101218;
            color: #f1f1f1;
            font-family: Arial, Helvetica, sans-serif;

            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: min(900px, 95vw);
            height: min(750px, 95vh);

            background: #181b23;
            border: 1px solid #303542;
            border-radius: 18px;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        header {
            padding: 18px 22px;

            background: #1d212b;
            border-bottom: 1px solid #303542;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brain {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            background: #5865f2;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 22px;
        }

        h1 {
            margin: 0;
            font-size: 20px;
        }

        .subtitle {
            color: #9299a8;
            font-size: 13px;
            margin-top: 3px;
        }

        .status {
            color: #6ee7a0;
            font-size: 13px;
        }

        #chat {
            flex: 1;

            overflow-y: auto;

            padding: 24px;

            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 80%;

            padding: 12px 15px;

            border-radius: 14px;

            line-height: 1.45;

            white-space: pre-wrap;

            word-wrap: break-word;
        }

        .user {
            align-self: flex-end;

            background: #5865f2;

            border-bottom-right-radius: 4px;
        }

        .ai {
            align-self: flex-start;

            background: #252a35;

            border-bottom-left-radius: 4px;
        }

        .system {
            align-self: center;

            color: #858c9c;

            font-size: 12px;

            text-align: center;
        }

        .typing {
            opacity: 0.6;
            font-style: italic;
        }

        .input-area {
            padding: 15px;

            background: #1d212b;

            border-top: 1px solid #303542;

            display: flex;
            gap: 10px;
        }

        #input {
            flex: 1;

            min-width: 0;

            background: #101218;
            color: white;

            border: 1px solid #343a49;

            border-radius: 12px;

            padding: 13px 15px;

            font-size: 15px;

            outline: none;
        }

        #input:focus {
            border-color: #5865f2;
        }

        button {
            border: none;

            border-radius: 12px;

            padding: 0 20px;

            background: #5865f2;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.1);
        }

        button:active {
            transform: scale(0.98);
        }

        .commands {
            padding: 8px 15px 0;

            color: #70788a;

            font-size: 11px;

            text-align: center;
        }

        code {
            color: #aab4ff;
        }

        @media (max-width: 600px) {
            .app {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
            }

            .message {
                max-width: 90%;
            }

            .status {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <div class="title">
            <div class="brain">🧠</div>

            <div>
                <h1>JavaScript AI</h1>
                <div class="subtitle">No LLM • No API • Local AI</div>
            </div>
        </div>

        <div class="status">
            ● ONLINE
        </div>
    </header>

    <div id="chat"></div>

    <div class="commands">
        Try <code>help</code>, <code>remember my name is...</code>,
        <code>what is my name?</code>, or <code>teach: question = answer</code>
    </div>

    <div class="input-area">
        <input
            id="input"
            type="text"
            placeholder="Talk to the AI..."
            autocomplete="off"
        >

        <button id="send">Send</button>
    </div>

</div>

<script src="ai.js"></script>

</body>
</html>
